name: CI

# Guardrails as cost control — these catch what a prompt shouldn't have to.
# Two tiers, because they have genuinely different requirements:
#   quality   — no warehouse needed. Always runs. This is the gate that matters.
#   warehouse — needs Snowflake. Opt-in, key-pair auth, isolated database.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Commit messages: <type>(<scope>): ETG-<number> <description>
  # ---------------------------------------------------------------------------
  commit-messages:
    name: Commit message convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every commit on this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          failed=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            git log -1 --pretty=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! python scripts/check_commit_msg.py "$RUNNER_TEMP/msg.txt"; then
              echo "::error::$(git log -1 --pretty='%h %s' "$sha")"
              failed=1
            fi
          done
          exit $failed

  # ---------------------------------------------------------------------------
  # Lint, tests, and dbt Core parse. No warehouse connection.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, test, dbt Core parse
    runs-on: ubuntu-latest

    # dbt Core needs a resolvable profile to parse, but does NOT connect.
    # Dummy values are sufficient and keep this whole job warehouse-free.
    env:
      SNOWFLAKE_ACCOUNT: ci-parse-only
      SNOWFLAKE_USER: ci-parse-only
      SNOWFLAKE_ROLE: ci-parse-only
      SNOWFLAKE_WAREHOUSE: ci-parse-only
      SNOWFLAKE_DATABASE: EXPERT_TALK

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: ruff — lint
        run: ruff check .

      - name: ruff — format
        run: ruff format --check .

      - name: No hardcoded credentials
        run: |
          git ls-files \
            | grep -vE '\.(xlsx|png|jpg|jpeg|pdf|zip)$' \
            | xargs python scripts/check_no_secrets.py

      - name: pytest
        run: pytest -m "not snowflake"

      - name: dbt Core — deps and parse
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          dbt deps  --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt

      - name: sqlfluff — lint SQL models
        run: |
          # Exits cleanly when no models exist yet — they are built live on stage.
          if compgen -G "dbt/models/**/*.sql" > /dev/null; then
            sqlfluff lint dbt/models
          else
            echo "No dbt models yet — skipping. They get built live during the demo."
          fi

  # ---------------------------------------------------------------------------
  # Real warehouse build against Snowflake.
  #
  # OPT-IN. To enable:
  #   1. Repository variable  SNOWFLAKE_CI_ENABLED = true
  #   2. Environment 'snowflake-ci' with these secrets:
  #        SNOWFLAKE_ACCOUNT, SNOWFLAKE_CI_USER, SNOWFLAKE_CI_ROLE,
  #        SNOWFLAKE_CI_WAREHOUSE, SNOWFLAKE_PRIVATE_KEY,
  #        SNOWFLAKE_PRIVATE_KEY_PASSPHRASE (optional)
  #
  # Key-pair auth, NOT externalbrowser: GitHub Actions has no browser, so the SSO
  # flow used on a laptop cannot work here. This needs a dedicated service user.
  #
  # Builds into EXPERT_TALK_CI, never EXPERT_TALK, so it cannot touch demo objects.
  # ---------------------------------------------------------------------------
  warehouse:
    name: dbt Core build (Snowflake)
    runs-on: ubuntu-latest
    needs: [quality]
    if: vars.SNOWFLAKE_CI_ENABLED == 'true'
    environment: snowflake-ci

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_CI_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}
      SNOWFLAKE_DATABASE: EXPERT_TALK_CI
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.ci_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Write service-user private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: Fetch source dataset
        run: |
          mkdir -p data/raw
          curl -sSL --retry 3 -o "$RUNNER_TEMP/or.zip" \
            "https://archive.ics.uci.edu/static/public/352/online+retail.zip"
          unzip -p "$RUNNER_TEMP/or.zip" "Online Retail.xlsx" > data/raw/Online_Retail.xlsx

      - name: Load Bronze
        if: hashFiles('src/bronze/**/*.py') != ''
        run: python -m src.bronze.load_online_retail

      - name: dbt Core — build and test
        if: hashFiles('dbt/models/**/*.sql') != ''
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          dbt deps  --project-dir dbt --profiles-dir dbt
          dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: Upload dbt artifacts
        if: always() && hashFiles('dbt/target/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/
          retention-days: 7

      - name: Tear down the CI database
        if: always()
        run: |
          python - <<'PY'
          import os
          import snowflake.connector

          conn = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              role=os.environ["SNOWFLAKE_ROLE"],
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
              private_key_file=os.environ["SNOWFLAKE_PRIVATE_KEY_PATH"],
              private_key_file_pwd=os.environ.get("SNOWFLAKE_PRIVATE_KEY_PASSPHRASE") or None,
          )
          # EXPERT_TALK_CI only — never the demo database.
          conn.cursor().execute("drop database if exists EXPERT_TALK_CI")
          PY

      - name: Shred the private key
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
