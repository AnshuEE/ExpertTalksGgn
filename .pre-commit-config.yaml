# Guardrails as cost control: these catch what a prompt shouldn't have to.
# Install both stages:  pre-commit install && pre-commit install --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]      # the 23MB source .xlsx must never be committed
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commit-msg-convention
        name: Conventional Commit with ETG ticket reference
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

      - id: no-hardcoded-snowflake-account
        name: No Snowflake account identifiers in tracked files
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
        types: [text]

      - id: pytest
        name: pytest
        entry: pytest -q -m "not snowflake"
        language: system
        pass_filenames: false
        always_run: true
