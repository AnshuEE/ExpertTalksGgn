[project]
name = "expert-talk-ggn"
version = "0.1.0"
description = "Snowflake Bronze/Silver/Gold pipeline over UCI Online Retail — Expert Talks Gurgaon"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so tests can import scripts/ and src/
addopts = "-v --strict-markers"
markers = [
    "snowflake: test requires a live Snowflake connection (deselect with -m 'not snowflake')",
]
